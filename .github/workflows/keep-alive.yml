name: Supabase keep-alive

# Supabase pauzeert gratis projecten na 7 dagen zonder activiteit. Deze taak
# doet dagelijks een kleine leesactie op de database zodat dat nooit gebeurt.
# Mislukt de taak (bv. omdat het project toch gepauzeerd is), dan stuurt GitHub
# automatisch een e-mail.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Database aanroepen
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          curl --fail-with-body -sS --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/companies?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"

      # GitHub zet geplande taken uit na 60 dagen zonder commits in de repository.
      # Door de taak hier zelf opnieuw aan te zetten blijft hij altijd actief.
      - name: Taak actief houden
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable"
